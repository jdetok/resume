<section class="projects">
  {{ range .Site.Data.cv.osp }}
     <div class="osp">
        <span class="subsect_ttl"><a href={{ .project_link }} target="_blank"><strong>{{ .project_lbl }}</strong></a>: {{ .project_desc }} | <a href={{ .src_lnk }} target="_blank">{{ .src_lbl}}</a></span>
        <ul class="horiz_ul">
        {{ range .tech }}
            <li>{{ . }}</li>
        {{ end }}
        </ul>
        <ul class="highlights">
        {{ range .highlights }}
            <li>{{ . }}</li>
        {{ end }}
        </ul>
    </div>
  {{ end }}
</section>
